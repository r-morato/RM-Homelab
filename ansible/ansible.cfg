[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
# community.general and ansible.posix ship with the Debian `ansible` package on
# the control node; there is no requirements.yml at the repo root on purpose, so
# Semaphore does not pull newer (breaking) collection versions from Galaxy.
host_key_checking    = True
retry_files_enabled  = False
stdout_callback      = default
result_format        = yaml
callbacks_enabled    = profile_tasks, timer
interpreter_python   = auto_silent
forks                = 10
timeout              = 30
nocows               = True
deprecation_warnings = False

[ssh_connection]
pipelining  = True
ssh_args    = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
scp_if_ssh  = smart

[privilege_escalation]
# Every target is entered as root over SSH (Proxmox nodes and the single-purpose
# containers alike), so no become is needed. Left explicit for clarity.
become = False
